name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack zip
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Unpacking $ZIP"
          mkdir -p project
          unzip -q -o "$ZIP" -d project
          SETTINGS=$(find project -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK уже есть на ubuntu-latest, только принимаем лицензии
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug --no-daemon; else gradle assembleDebug --no-daemon; fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
